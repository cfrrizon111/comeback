erviews')"><div class=mi>◎</div><strong>Interview prep</strong><small>Prepare, practise and reflect</small></button><button class=module-tile onclick="go('certifications')"><div class=mi>✧</div><strong>Certificates</strong><small>Keep credentials and links together</small></button><button class=module-tile onclick="go('road')"><div class=mi>⌬</div><strong>Learning roadmap</strong><small>Connect learning to career skills</small></button></div><div class=section-head><h3>Upcoming follow-ups</h3><button onclick="go('applications')">View pipeline →</button></div>${upcoming.length?upcoming.map(x=>`<div class=card><div class=row><strong>${esc(x.company)} · ${esc(x.role||'Role')}</strong><span class=pill>${esc(x.status||'Saved')}</span></div><p class=mu>${x.nextDate} · ${esc(x.type||'Opportunity')}</p></div>`).join(''):'<div class=empty-state>No follow-ups yet. Add an opportunity and set a next action date.'}<div class=section-head><h3>Career readiness</h3><span class=mu>Evidence-based, not a hiring prediction</span></div><div class=card><p>Projects with progress: <b>${projects}</b></p><p>Skills documented: <b>${skills}</b></p><p>Credentials recorded: <b>${S.certifications.length}</b></p><p>Interview practice records: <b>${S.interviews.length}</b></p><p class=mu>Use this overview to identify missing evidence. It does not estimate your likelihood of getting hired.</p></div>`};

const b=[];for(let i=13;i>=0;i--)b.push([dt(add(t,-i)).getDate(),D(i)]);const bm=Math.max(60,...b.map(x=>x[1])),[pt,pd]=pyStat();

<div class=card><h3>Subjects, last 30 days</h3>${Object.entries(sub).sort((a,b)=>b[1]-a[1]).map(([n,v])=>hb(n,v,v/mx*100,hm(v))).join('')||'<p class=mu>Log study sessions to see this.</p>'}</div>
<div class=card><h3>Consistency</h3><p>${c30} of the last 30 days had focus time (${Math.round(c30/30*100)}%)</p>${bar(c30/30*100)}</div>
